<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Math Warmups</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- CORE STYLES --- */
        body{font-family:'Fredoka','Comic Sans MS',sans-serif;background:linear-gradient(120deg,#a1c4fd,#c2e9fb) fixed;padding:20px;text-align:center;color:#333;margin:0;-webkit-print-color-adjust:exact}
        .container{max-width:900px;margin:30px auto;background:#fff;padding:35px;border-radius:30px;box-shadow:0 10px 0 #5c9ded,0 20px 30px rgba(0,0,0,.2);border:5px solid #d4e6f7;min-height:700px;position:relative}
        h1{color:#2c7be5;font-size:36px;margin:10px 0 30px;text-shadow:2px 2px 0 #bae0ff} h3{color:#555;font-size:24px;border-bottom:2px dashed #d4e6f7;padding-bottom:10px;text-align:left}
        .print-btn,.home-btn{position:absolute;top:20px;background:#fff;color:#555;border:2px solid #ccc;padding:8px 15px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;z-index:100;text-decoration:none}
        .print-btn{right:20px} .home-btn{left:20px;background:#f0f0f0} .print-btn:hover,.home-btn:hover{background:#e0e0e0;border-color:#bbb}
        
        /* Header for Print Only - HIDDEN ON SCREEN */
        .print-header { display: none; }
        .print-spacer { display: none; } 
        .answer-key-page { display: none; }

        /* Nav & Layout */
        .module-nav{display:flex;justify-content:center;gap:15px;margin-bottom:30px;flex-wrap:wrap;border-bottom:2px solid #eee;padding-bottom:20px}
        .btn-module{background:#6c5ce7;color:#fff;border:none;border-radius:12px;padding:12px 20px;cursor:pointer;font-size:16px;font-weight:600;box-shadow:0 5px 0 #5b4cc4;transition:.2s;flex:1;min-width:200px;max-width:260px}
        .btn-module:hover{background:#7d6cfeb4;transform:translateY(-2px)} .btn-module.active{background:#4834d4;transform:translateY(4px);box-shadow:0 1px 0 #5b4cc4;border:2px solid #a29bfe}
        .nav-container{display:flex;flex-direction:column;gap:20px;margin-bottom:40px} .week-row{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}
        .week-label{width:100%;color:#5c9ded;font-weight:700;font-size:18px;text-transform:uppercase}
        .nav-btn{background:#f0f7ff;border:3px solid #b3d7ff;border-radius:15px;padding:10px 20px;cursor:pointer;min-width:80px;height:50px;font-weight:700;color:#555;transition:.2s}
        .nav-btn:hover{transform:translateY(-3px);border-color:#5c9ded} .nav-btn.active{background:#2c7be5;color:#fff;border-color:#1a5bb8;box-shadow:0 5px 15px rgba(44,123,229,.4)}
        
        /* Questions & Helper Hub */
        .question-card{background:#f4f9fc;padding:25px;margin-bottom:25px;border-radius:20px;text-align:left;border-left:8px solid #ffab00;box-shadow:0 4px 10px rgba(0,0,0,.05);break-inside:avoid}
        .instructions{font-size:18px;color:#444;margin-bottom:20px;font-style:italic; line-height: 1.4;}
        
        .helper-hub-card { background: #fffdf2; padding: 25px; margin-top: 25px; border-radius: 20px; border: 3px dashed #f1c40f; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,.05); break-inside: avoid; page-break-inside: avoid; }
        .helper-hub-card h3 { border-bottom: 2px dashed #f39c12; color: #d35400; margin-top: 0; padding-bottom: 10px; }
        
        /* --- SUB-CARD FOR INDIVIDUAL MATH PROBLEMS --- */
        .math-problem { 
            display: block; 
            font-size: 20px; 
            margin-bottom: 20px; 
            color: #444; 
            line-height: 1.6; 
            background: #ffffff; 
            border: 2px solid #d4e6f7; 
            border-radius: 15px; 
            padding: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .math-problem:last-child { margin-bottom: 0; }
        
        .input-box{ display: inline-block; vertical-align: middle; padding:8px; font-size:20px; width:80px; border:3px solid #ffab00; border-radius:12px; background:#fffcf2; text-align:center; outline:none; margin-left: 5px; }
        .input-box.correct{border-color:#2e7d32;background:#e8f5e9;color:#2e7d32} .input-box.incorrect{border-color:#c62828;background:#ffebee}
        .unknown-square{display:inline-block;width:24px;height:24px;border:3px solid #555;border-radius:4px;vertical-align:-5px;margin:0 4px;background:#fff}
        
        /* --- FRACTION STYLING --- */
        .inline-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 5px; font-size: 0.9em; }
        .inline-frac .num, .inline-frac .den { display: flex; align-items: center; justify-content: center; height: 38px; width: 100%; padding: 0 4px; }
        .inline-frac .num { border-bottom: 2px solid #444; }
        .inline-frac .input-box { width: 45px; height: 30px; font-size: 18px; text-align: center; margin: 0; padding: 2px; } 
        
        .frac-box-container { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 8px; }
        .frac-input { width: 50px; height: 38px; text-align: center; font-size: 22px; border: 3px solid #ffab00; border-radius: 8px; outline:none; background:#fffcf2; margin: 0; }
        .frac-line { width: 100%; height: 3px; background-color: #333; margin: 4px 0; border-radius: 2px; }
        .frac-box-container.correct .frac-input { border-color: #2e7d32; background: #e8f5e9; color: #2e7d32; }
        .frac-box-container.incorrect .frac-input { border-color: #c62828; background: #ffebee; color: #c62828; }

        /* --- PATTERN TABLE STYLING --- */
        table.pattern-table { border-collapse: collapse; margin: 10px auto; background: #fff; border: 3px solid #333; }
        table.pattern-table td { border: 2px solid #ccc; width: 65px; height: 65px; text-align: center; font-size: 24px; font-weight: bold; color: #444; }
        table.pattern-table .input-box { width: 45px; height: 35px; font-size: 20px; padding: 2px; margin: 0; display: inline-block; }

        /* Grid / Checkbox Styles */
        table.caaspp-grid{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:15px;overflow:hidden;border:2px solid #d4e6f7;margin-bottom:20px}
        table.caaspp-grid th{background:#d4e6f7;padding:15px;color:#2c7be5;font-weight:700;border-bottom:2px solid #fff}
        table.caaspp-grid td{padding:15px;border-bottom:1px solid #eee;text-align:center;vertical-align:middle}
        table.caaspp-grid td:first-child{text-align:left;font-weight:700;color:#444;padding-left:20px;border-right:1px solid #eee}
        
        /* Custom Checkbox UI */
        .checkbox-container { display: inline-block; position: relative; padding-left: 35px; margin-bottom: 12px; cursor: pointer; font-size: 22px; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        .checkbox-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { position: absolute; top: -10px; left: 0; height: 30px; width: 30px; background-color: #fff; border: 3px solid #b3d7ff; border-radius: 8px; }
        .checkbox-container:hover input ~ .checkmark { background-color: #f0f7ff; }
        .checkbox-container input:checked ~ .checkmark { background-color: #2c7be5; border-color: #2c7be5; }
        .checkmark:after { content: ""; position: absolute; display: none; }
        .checkbox-container input:checked ~ .checkmark:after { display: block; left: 9px; top: 3px; width: 8px; height: 16px; border: solid white; border-width: 0 4px 4px 0; -webkit-transform: rotate(45deg); -ms-transform: rotate(45deg); transform: rotate(45deg); }
        .checkbox-container.correct-check .checkmark { background-color: #00c853 !important; border-color: #00c853 !important; }
        .checkbox-container.incorrect-check .checkmark { background-color: #e74c3c !important; border-color: #e74c3c !important; }

        /* Multiple Choice & Double Input */
        .mc-option{ display: flex; align-items: center; gap: 15px; font-size: 20px; margin-bottom: 15px; color: #444; padding:10px; border-radius:10px; cursor:pointer; transition:background .2s } 
        .mc-option:hover{background:#e6f2ff}
        .mc-correct{background:#e8f5e9!important;border:2px solid #2e7d32} .mc-incorrect{background:#ffebee!important;border:2px solid #c62828}
        .double-input-container{background:#fff;padding:25px;border-radius:15px;border:3px dashed #cdb4db;text-align:center} .box-row{display:flex;justify-content:center;gap:30px;margin-top:15px}

        /* Controls */
        .footer-controls{margin-top:40px;padding-top:20px;border-top:2px dashed #d4e6f7;display:flex;flex-direction:column;align-items:center;gap:20px}
        .check-btn,.btn-extra{color:#fff;padding:15px 50px;border:none;border-radius:50px;font-size:24px;font-weight:600;cursor:pointer;transition:.1s;font-family:inherit}
        .check-btn{background:#00c853;box-shadow:0 8px 0 #009624} .check-btn:hover{background:#00e676;transform:translateY(2px)} .check-btn:active{transform:translateY(6px);box-shadow:0 2px 0}
        .check-btn:disabled{background:#95a5a6;box-shadow:none;transform:translateY(6px)}
        .btn-extra{background:#9b59b6;box-shadow:0 8px 0 #8e44ad;font-size:18px;margin-top:40px;padding:12px 30px} .btn-extra:hover{background:#af7ac5;transform:translateY(2px)}
        .feedback-box{font-size:20px;font-weight:700;padding:15px;border-radius:15px;width:100%;max-width:600px;display:none}
        .feedback-box.correct{display:block;background:#e8f5e9;color:#2e7d32;border:2px solid #a5d6a7}
        .feedback-box.warning{display:block;background:#fff3e0;color:#ef6c00;border:2px solid #ffcc80}
        .feedback-box.info{display:block;background:#e3f2fd;color:#1565c0;border:2px solid #90caf9}
        .hidden{display:none} 
        .correction-text{color:#27ae60;font-weight:700;font-size:18px;background:#e8f5e9;padding:5px 10px;border-radius:10px;border:2px solid #a5d6a7; display: inline-block; margin: 4px; line-height: 1.2; white-space: nowrap;}
        
        /* Extra Practice Styles */
        #extraPracticeContainer{margin-top:30px;background:#fcf4fc;padding:25px;border-radius:20px;border:4px dashed #cdb4db}
        .drill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
        .drill-card{background:#fff;padding:15px;border-radius:15px;box-shadow:0 2px 5px rgba(0,0,0,.05);font-size:20px;font-weight:700;display:flex;justify-content:center;gap:10px;border:2px solid transparent}
        .drill-input{width:60px!important;padding:5px!important;font-size:20px!important;border:3px solid #cdb4db!important;border-radius:8px!important;text-align:center;background:#fff}

        /* --- PRINT STYLES --- */
        @media print {
            @page { size: landscape; margin: 0.3in; }
            body { background: none; color: #000; padding: 0; margin: 0; zoom: 0.95; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; margin: 0; padding: 0; }
            .module-nav, .nav-container, .footer-controls, .print-btn, .home-btn, 
            #placeholder, .btn-extra, #extraPracticeContainer, .tbd-message, h1 { display: none !important; }
            
            /* Tightened grid gap to save horizontal space */
            #content-area { display: grid !important; grid-template-columns: 1fr 1fr; grid-gap: 20px; width: 100%; }
            
            /* Border-bottom removed to prevent heavy line appearance */
            .print-header { font-family: 'Roboto', sans-serif; grid-column: 1 / -1; display: flex !important; justify-content: space-between; gap: 20px; width: 100%; font-size: 16px; font-weight: 600; margin-top: 5px; margin-bottom: 10px; padding-bottom: 5px; border-bottom: none; white-space: nowrap; }
            
            .day-content { display: block !important; border: none !important; padding: 0 !important; margin-bottom: 15px !important; break-inside: avoid; page-break-inside: avoid; }
            
            /* Tightened question card padding to save vertical space */
            .question-card { border: 1px solid #ccc !important; box-shadow: none !important; background: #fff !important; margin-bottom: 12px !important; padding: 10px 12px !important; border-radius: 10px !important; break-inside: avoid; page-break-inside: avoid; }
            
            .helper-hub-card { display: block !important; border: 2px dashed #666 !important; background: #f9f9f9 !important; border-radius: 15px; padding: 15px !important; margin-top: 0 !important; break-inside: avoid; page-break-inside: avoid; box-shadow: none; align-self: start; }
            .helper-hub-card * { color: #333 !important; }
            .helper-hub-card h3 { font-size: 18px !important; color: #000 !important; border-bottom: 2px dashed #666 !important; margin-top: 0; padding-bottom: 8px; }
            
            .helper-hub-card svg *[stroke="#e74c3c"], .helper-hub-card svg *[stroke="#2c7be5"] { stroke: #666 !important; }
            .helper-hub-card svg rect[fill="#e3f2fd"], .helper-hub-card svg rect[fill="#fff9c4"], .helper-hub-card svg rect[fill="#c8e6c9"] { fill: #fff !important; stroke: #333 !important; }
            .helper-hub-card svg rect[fill="#81ecec"] { fill: #ddd !important; }
            
            /* Tightened math problem spacing */
            .math-problem { display: block; margin-bottom: 8px !important; border: none !important; padding: 0 !important; font-size: 16px !important; break-inside: avoid; page-break-inside: avoid; line-height: 1.3 !important; } 
            
            .print-break { break-after: page; page-break-after: always; }
            .print-spacer { display: block !important; border: none; height: 10px; }
            
            /* Removed border from the whole page to stop bleeding */
            .answer-key-page { display: block !important; grid-column: 1 / -1; break-before: page; page-break-before: always; text-align: left; padding: 10px 0; border: none; }
            .answer-key-page h2 { font-size: 22px; margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 5px; } 
            
            .ak-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
            .ak-week h4 { border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 10px; font-size: 18px; }
            .ak-day { margin-bottom: 10px; font-size: 12px; line-height: 1.3; border-bottom: 1px dashed #ccc; padding-bottom: 5px;}
            .ak-day strong { display: block; color: #444; margin-bottom: 2px; }
            
            /* Tighter headers */
            h3 { color: #000; border-bottom: 1px solid #000; margin-top: 0; font-size: 18px; margin-bottom: 6px; padding-bottom: 4px !important; }
            .instructions { font-size: 15px !important; margin-bottom: 6px !important; }
            .q-num { font-size: 16px !important; }
            .q-num span { color: #000 !important; }
            
            .math-problem > div[style*="text-align: center"] { margin-bottom: 2px !important; }
            .math-problem svg.fraction-bar-svg, .math-problem svg.number-line-svg { max-height: 70px !important; width: auto !important; margin: 2px auto !important; }
            .math-problem svg.pattern-line-svg { max-height: 80px !important; width: 100% !important; margin: 2px auto !important; }
            
            /* SVG max height bumped down from 160 to 140 to prevent page overflow */
            .grid-area-svg, .polygon-svg, .ruler-svg { max-height: 140px !important; margin: 2px auto !important; }
            
            svg { filter: grayscale(100%); }
            line[stroke="#ccc"] { stroke: #666 !important; } 
            rect[fill="#81ecec"] { fill: #aaa !important; stroke: #000 !important; stroke-width: 1.5px !important; } 
            polygon { fill: #e0e0e0 !important; stroke: #000 !important; stroke-width: 2px !important; }
            .ruler-svg rect[fill="#e3f2fd"] { fill: #ddd !important; stroke: #000 !important; stroke-width: 2px !important; }
            .ruler-svg rect[fill="#fbd26a"] { fill: #fff !important; stroke: #000 !important; stroke-width: 2px !important; }
            
            table.caaspp-grid { border: 1px solid #000; margin-bottom: 6px !important; font-size: 14px !important;}
            table.caaspp-grid th { background: #eee; color: #000; border-bottom: 1px solid #000; padding: 4px !important; }
            table.caaspp-grid td { border-bottom: 1px solid #ccc; padding: 4px !important; }
            table.caaspp-grid td:first-child { padding-left: 6px !important; }
            
            .pattern-table-container { margin: 2px 0 !important; }
            table.pattern-table td { width: 36px !important; height: 36px !important; font-size: 16px !important; padding: 2px !important; }
            
            .input-box, .frac-input, .drill-input { 
                border: 2px solid #000 !important; 
                background: #fff !important; 
                color: transparent !important; 
                text-shadow: none !important; 
                -webkit-text-fill-color: transparent !important; 
                display: inline-block; 
                vertical-align: middle; 
                width: 40px !important; 
                height: 24px !important; 
                padding: 2px !important; 
                font-size: 14px !important; 
                margin: 0 4px !important;
            }
            .frac-input { width: 30px !important; height: 24px !important; }
            .inline-frac .input-box { width: 30px !important; height: 24px !important; }
            table.pattern-table .input-box { width: 28px !important; height: 22px !important; font-size: 14px !important; }
            
            input[type="radio"], input[type="checkbox"] { 
                -webkit-appearance: none; 
                -moz-appearance: none; 
                appearance: none; 
                border: 1px solid #000; 
                background: #fff; 
            }
            input[type="radio"] { width: 14px; height: 14px; border-radius: 50%; }
            input[type="checkbox"] { width: 14px; height: 14px; border-radius: 2px; }
            
            .checkbox-container input { position: static; opacity: 1; margin: 0; } .checkmark { display: none; }
            .checkbox-container { padding-left: 0 !important; margin-bottom: 0 !important; } 
            
            .correction-text, .grid-answer-indicator { display: none !important; }
            .double-input-container { border: 2px dashed #000; padding: 10px !important; margin-bottom: 5px !important;}
            
            .mc-option { border: 1px solid #ccc; display: flex; align-items: center; padding: 4px 6px !important; margin-bottom: 4px !important; font-size: 16px !important;}
            .mc-option svg { max-width: 150px !important; max-height: 40px !important; margin: 0 !important; }
        }
    </style>

    <script>
        // --- GLOBAL SVG & HTML GENERATORS ---
        
        function drawNumberLine(divisions, pointAt) {
            let svg = `<svg class="number-line-svg" width="400" height="100" viewBox="0 0 400 100" style="margin: 10px 0;">`;
            svg += `<line x1="40" y1="50" x2="360" y2="50" stroke="#333" stroke-width="3" />`; 
            svg += `<polygon points="40,50 50,45 50,55" fill="#333" />`; 
            svg += `<polygon points="360,50 350,45 350,55" fill="#333" />`; 
            let startX = 60, endX = 340, width = endX - startX;
            for (let i = 0; i <= divisions; i++) {
                let x = startX + (width / divisions) * i;
                svg += `<line x1="${x}" y1="40" x2="${x}" y2="60" stroke="#333" stroke-width="3" />`;
                if (i === 0) svg += `<text x="${x}" y="80" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">0</text>`;
                if (i === divisions) svg += `<text x="${x}" y="80" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">1</text>`;
                if (i === pointAt) {
                    svg += `<circle cx="${x}" cy="50" r="7" fill="#c62828" />`;
                    svg += `<text x="${x}" y="30" font-size="22" font-weight="bold" fill="#c62828" text-anchor="middle">A</text>`;
                }
            }
            svg += `</svg>`;
            return svg;
        }

        function drawFractionBar(divisions, shadedCount) {
            let svg = `<svg class="fraction-bar-svg" width="300" height="60" viewBox="0 0 300 60" style="margin: 5px 0;">`;
            let boxWidth = 298 / divisions;
            for (let i = 0; i < divisions; i++) {
                let fill = i < shadedCount ? "#81ecec" : "#fff";
                svg += `<rect x="${1 + (i * boxWidth)}" y="10" width="${boxWidth}" height="40" fill="${fill}" stroke="#333" stroke-width="2" />`;
            }
            svg += `</svg>`;
            return svg;
        }

        function drawPatternLine(values, answers) {
            let svg = `<svg class="pattern-line-svg" width="100%" height="150" viewBox="0 0 600 150" style="margin: 10px 0; max-width: 100%; overflow: visible;">`;
            svg += `<line x1="30" y1="100" x2="570" y2="100" stroke="#333" stroke-width="3" />`; 
            svg += `<polygon points="30,100 45,92 45,108" fill="#333" />`; 
            svg += `<polygon points="570,100 555,92 555,108" fill="#333" />`; 
            let n = values.length;
            let startX = 60, endX = 540, gap = (endX - startX) / (n - 1);
            let ansIdx = 0;
            for (let i = 0; i < n; i++) {
                let x = startX + i * gap;
                svg += `<line x1="${x}" y1="90" x2="${x}" y2="110" stroke="#333" stroke-width="3" />`;
                if (values[i] !== null) {
                    svg += `<text x="${x}" y="75" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">${values[i]}</text>`;
                } else {
                    let ans = answers[ansIdx++];
                    svg += `<foreignObject x="${x - 60}" y="0" width="120" height="150">
                        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex; flex-direction:column; align-items:center; padding-top: 40px; height: 100%;">
                            <input type="text" class="input-box" data-answer="${ans}" style="width:50px; height:40px; font-size:22px; padding:2px; margin:0;">
                        </div>
                    </foreignObject>`;
                }
            }
            svg += `</svg>`;
            return svg;
        }

        function drawPatternTable(grid) {
            let html = `<table class="pattern-table">`;
            grid.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => {
                    if (cell.startsWith("ans:")) {
                        let ans = cell.split(":")[1];
                        html += `<td><input type="text" class="input-box" data-answer="${ans}"></td>`;
                    } else {
                        html += `<td>${cell}</td>`;
                    }
                });
                html += `</tr>`;
            });
            html += `</table>`;
            return html;
        }
        
        function rectCoords(startRow, startCol, rows, cols) {
            let pts = [];
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    pts.push([startRow+r, startCol+c]);
                }
            }
            return pts;
        }

        function drawGridArea(gridW, gridH, shadedCoords) {
            let cellSize = 25;
            let totalW = gridW * cellSize + 2;
            let totalH = gridH * cellSize + 2;
            let svg = `<svg class="grid-area-svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" style="margin:10px auto;">`;
            
            shadedCoords.forEach(([r, c]) => {
                let y = (r-1) * cellSize + 1;
                let x = (c-1) * cellSize + 1;
                svg += `<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" fill="#81ecec" stroke="#333" stroke-width="1"/>`;
            });
            
            for(let i=0; i<=gridW; i++) {
                svg += `<line x1="${i*cellSize+1}" y1="1" x2="${i*cellSize+1}" y2="${gridH*cellSize+1}" stroke="#ccc" stroke-width="1"/>`;
            }
            for(let i=0; i<=gridH; i++) {
                svg += `<line x1="1" y1="${i*cellSize+1}" x2="${gridW*cellSize+1}" y2="${i*cellSize+1}" stroke="#ccc" stroke-width="1"/>`;
            }
            
            svg += `<rect x="1" y="1" width="${gridW*cellSize}" height="${gridH*cellSize}" fill="none" stroke="#333" stroke-width="2"/>`;
            svg += `</svg>`;
            return svg;
        }

        function drawPolygon(w, h, points, labels) {
            let svg = `<svg class="polygon-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="margin: 10px auto; max-width: 100%;">`;
            let ptsStr = points.map(p => p.join(',')).join(' ');
            svg += `<polygon points="${ptsStr}" fill="#e3f2fd" stroke="#1a5bb8" stroke-width="3" />`;
            labels.forEach(l => {
                svg += `<text x="${l.x}" y="${l.y}" font-size="16" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">${l.t}</text>`;
            });
            svg += `</svg>`;
            return svg;
        }

        function drawRulerRectangle(wUnits, hUnits) {
            let u = 35; 
            let svgW = (wUnits + 2.5) * u;
            let svgH = (hUnits + 2.5) * u;
            let svg = `<svg class="ruler-svg" width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" style="margin:10px auto; overflow:visible; max-width: 100%;">`;
            
            let originX = u * 1.5;
            let originY = svgH - u * 1.5;

            svg += `<rect x="${originX}" y="${originY - hUnits*u}" width="${wUnits*u}" height="${hUnits*u}" fill="#e3f2fd" stroke="#1a5bb8" stroke-width="3"/>`;
            
            svg += `<rect x="${originX}" y="${originY}" width="${(wUnits+1)*u}" height="30" fill="#fbd26a" stroke="#333" stroke-width="2"/>`;
            for(let i=0; i<=wUnits+1; i++) {
                let x = originX + i*u;
                svg += `<line x1="${x}" y1="${originY}" x2="${x}" y2="${originY + 10}" stroke="#333" stroke-width="2"/>`;
                svg += `<text x="${x}" y="${originY + 24}" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">${i}</text>`;
            }
            
            svg += `<rect x="${originX - 30}" y="${originY - (hUnits+1)*u}" width="30" height="${(hUnits+1)*u}" fill="#fbd26a" stroke="#333" stroke-width="2"/>`;
            for(let i=0; i<=hUnits+1; i++) {
                let y = originY - i*u;
                svg += `<line x1="${originX-15}" y1="${y}" x2="${originX}" y2="${y}" stroke="#333" stroke-width="2"/>`;
                svg += `<text x="${originX-18}" y="${y+5}" font-size="14" font-weight="bold" fill="#333" text-anchor="end">${i}</text>`;
            }
            
            svg += `</svg>`;
            return svg;
        }
    </script>

<body>

<div class="container">
    <a href="index.html" class="home-btn">🏠 Home</a>
    <button class="print-btn" onclick="window.print()">🖨️ Print Worksheet</button>

    <h1>Grade 3 Math Warmups</h1>

    <div class="module-nav">
        <button class="btn-module" onclick="selectModule(0)">Multiply & Divide Within 100</button>
        <button class="btn-module" onclick="selectModule(1)">Mult/Div: Interpret & Solve</button>
        <button class="btn-module" onclick="selectModule(2)">Properties of Mult/Div</button>
        <button class="btn-module" onclick="selectModule(3)">Number & Ops in Base Ten</button>
        <button class="btn-module" onclick="selectModule(4)">Two-Week Review</button>
        <button class="btn-module" onclick="selectModule(5)">Number & Ops: Fractions</button>
        <button class="btn-module" onclick="selectModule(6)">Four Ops: Patterns & Logic</button>

    <div class="nav-container" id="navContainer"></div>

    <div id="content-area">
        <div id="placeholder" style="text-align: center; color: #888; margin-top: 50px; font-size: 20px;">
            Select a module above to begin!
        </div>
    </div>
    
    <div class="footer-controls" id="footer-controls" style="display:none;">
        <div id="feedback-box" class="feedback-box"></div>
        <button class="check-btn" onclick="checkAnswers()">Check Answers</button>
    </div>
    
    <button id="btnExtra" class="btn-extra hidden" onclick="startExtraPractice()">⚡ Bonus: Extra Practice</button>
    
    <div id="extraPracticeContainer" class="hidden">
        <h3 style="color: #8e44ad; border-bottom: 2px dashed #cdb4db;">Mixed Multiplication & Division Drills</h3>
        <p style="margin-bottom: 20px;">Fill in the missing numbers!</p>
        <div id="drillGrid" class="drill-grid"></div>
        <button class="btn-extra" style="margin-top: 10px; background-color: #9b59b6;" onclick="checkDrills()">Check My Work</button>
        <div id="drillFeedback" class="feedback-box"></div>
    </div>
</div>

<script>

    // --- MAIN STATE & LOGIC ---
    let currentModuleIndex = -1;
    let currentDayId = '';
    let attempts = {}; 

    function selectModule(index) {
        const appData = {
            modules: [
                typeof mod1Data !== 'undefined' ? mod1Data : {name: "Module 1", weeks: false}, 
                typeof mod2Data !== 'undefined' ? mod2Data : {name: "Module 2", weeks: false}, 
                typeof mod3Data !== 'undefined' ? mod3Data : {name: "Module 3", weeks: false}, 
                typeof mod4Data !== 'undefined' ? mod4Data : {name: "Module 4", weeks: false},
                typeof mod5Data !== 'undefined' ? mod5Data : {name: "Two-Week Review", weeks: false},
                typeof mod6Data !== 'undefined' ? mod6Data : {name: "Number & Ops: Fractions", weeks: false},
                typeof mod7Data !== 'undefined' ? mod7Data : {name: "Four Ops: Patterns & Logic", weeks: false},
                typeof mod8Data !== 'undefined' ? mod8Data : {name: "Linear Area & Measurement", weeks: false} 
            ]
        };

        if(index < 0 || index >= appData.modules.length) index = 0;
        currentModuleIndex = index;
        
        // Update URL Params
        const url = new URL(window.location);
        url.searchParams.set('module', index);
        window.history.pushState({}, '', url);

        document.querySelectorAll('.btn-module').forEach((btn, idx) => btn.classList.toggle('active', idx === index));

        const module = appData.modules[index];
        const navContainer = document.getElementById('navContainer');
        const contentArea = document.getElementById('content-area');
        
        // Reset View
        navContainer.innerHTML = '';
        contentArea.innerHTML = ''; 
        document.getElementById('footer-controls').style.display = 'none';
        
        // Toggle Extra Practice
        const extraBtn = document.getElementById('btnExtra');
        const extraCont = document.getElementById('extraPracticeContainer');
        if(module.weeks) { extraBtn.classList.remove('hidden'); } 
        else { extraBtn.classList.add('hidden'); extraCont.classList.add('hidden'); }

        if (!module.weeks) {
            contentArea.innerHTML = `<div class="tbd-message">Coming Soon: ${module.name} content is TBD! 🚧</div>`;
            return;
        }

        module.weeks.forEach(week => {
            const label = document.createElement('div');
            label.className = 'week-label';
            if (week.weekNum > 1) label.style.marginTop = '15px';
            label.textContent = `Week ${week.weekNum}`;
            navContainer.appendChild(label);

            const row = document.createElement('div'); 
            row.className = 'week-row';
            
            week.days.forEach(day => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn'; btn.textContent = day.name;
                btn.onclick = () => showDay(day.id, btn);
                row.appendChild(btn);
                
                // --- PRINT HEADER INSERTION ---
                if (day.name === 'Mon') {
                    const printHeader = document.createElement('div');
                    printHeader.className = 'print-header';
                    printHeader.innerHTML = `<span>Name: _______________________________</span><span>Date: ____________________</span><span>Module: ${module.name}</span>`;
                    contentArea.appendChild(printHeader);
                }

                const dayDiv = document.createElement('div');
                dayDiv.id = day.id; dayDiv.className = 'day-content hidden';
                dayDiv.innerHTML = `<h3>${day.title}</h3>`;
                
                if (day.name === 'Tue' || day.name === 'Thu') {
                    dayDiv.classList.add('print-break');
                }
                
                day.sections.forEach(sec => {
                    const card = document.createElement('div'); card.className = 'question-card';
                    
                    // SMART NUMBER EXTRACTION
                    let qNumHtml = "";
                    let instrText = sec.instruction || "";
                    let overrideProbText = null;
                    
                    let matchInst = instrText.match(/^(\d+\.)(?:\s*&nbsp;\s*|\s+)/);
                    if (matchInst) {
                        qNumHtml = `<div class="q-num" style="font-size: 22px; padding-top: 1px;"><span style="color:#2c7be5; font-weight:700; margin-right:8px;">${matchInst[1]}</span></div>`;
                        instrText = instrText.substring(matchInst[0].length);
                    } else if (sec.problems && sec.problems.length > 0 && sec.problems[0].text) {
                        let text = sec.problems[0].text.trim();
                        let matchProb = text.match(/^(\d+\.)(?:\s*&nbsp;\s*|\s+)/);
                        if (matchProb) {
                            qNumHtml = `<div class="q-num" style="font-size: 22px; padding-top: 1px;"><span style="color:#2c7be5; font-weight:700; margin-right:8px;">${matchProb[1]}</span></div>`;
                            overrideProbText = text.substring(matchProb[0].length);
                        }
                    }
                    
                    const iText = instrText.split(':');
                    const iHtml = iText.length > 1 ? `<strong>${formatText(iText[0]+':')}</strong>${formatText(iText.slice(1).join(':'))}` : formatText(instrText);
                    
                    card.innerHTML = `<div style="display:flex; align-items:flex-start; margin-bottom: 20px;"><div class="instructions-wrapper" style="display:flex; align-items:flex-start; width: 100%;">${qNumHtml}<div class="instructions" style="margin-bottom:0; width: 100%;">${iHtml}</div></div></div>`;
                    
                    if (sec.type === 'grid') card.appendChild(createGrid(sec.rows));
                    else if (sec.type === 'input' || sec.type === 'fraction-input') {
                        sec.problems.forEach((p, idx) => {
                            card.appendChild(createProblem(p, sec.type, idx === 0 ? overrideProbText : null));
                        });
                    }
                    else if (sec.type === 'double') card.appendChild(createDouble(sec));
                    else if (sec.type === 'mc') {
                        if (sec.problems) {
                            sec.problems.forEach((p, idx) => card.appendChild(createProblem(p, 'mc', idx === 0 ? overrideProbText : null)));
                        }
                        card.appendChild(createMC(sec));
                    }
                    dayDiv.appendChild(card);
                });
                contentArea.appendChild(dayDiv);

                // --- HELPER HUB INSERTION (Slots into the empty right column on Print!) ---
                if (day.name === 'Fri' && week.helperHub) {
                    const hhDiv = document.createElement('div');
                    hhDiv.id = `hh-w${week.weekNum}`;
                    hhDiv.className = 'helper-hub-card hidden';
                    hhDiv.innerHTML = `<h3>${week.helperHub.title}</h3><div>${week.helperHub.content}</div>`;
                    contentArea.appendChild(hhDiv);
                }

                // Add print spacer ONLY if there's another week coming.
                // This prevents the double page-break before the Answer Key!
                if (day.name === 'Fri' && week.weekNum < module.weeks.length) {
                    const spacer = document.createElement('div');
                    spacer.className = 'print-spacer print-break'; 
                    contentArea.appendChild(spacer);
                }
            });
            navContainer.appendChild(row);
        });

        const answerKey = generateAnswerKey(module);
        contentArea.appendChild(answerKey);
    }

    function generateAnswerKey(module) {
        const div = document.createElement('div');
        div.className = 'answer-key-page';
        let html = `<h2>Teacher Answer Key: ${module.name}</h2><div class="ak-cols">`;
        
        module.weeks.forEach(week => {
            html += `<div class="ak-week"><h4>Week ${week.weekNum}</h4>`;
            week.days.forEach(day => {
                html += `<div class="ak-day"><strong>${day.name}:</strong> `;
                let answers = [];
                day.sections.forEach(sec => {
                    if (sec.type === 'input' || sec.type === 'fraction-input') {
                        sec.problems.forEach(p => {
                            if (p.answer) answers.push(p.answer);
                            if (p.patternLine) answers.push(...p.patternLine.answers);
                            if (p.table) {
                                p.table.forEach(r => r.forEach(c => { if(c.startsWith("ans:")) answers.push(c.split(":")[1]); }));
                            }
                        });
                    }
                    if (sec.type === 'double') answers.push(...sec.answers);
                    if (sec.type === 'mc') sec.options.forEach(o => { if(o.correct) answers.push(o.text ? `(MC: ${o.text})` : `(MC: Diagram)`); });
                    if (sec.type === 'grid') {
                        let bools = sec.rows.map(r => r.correct ? 'T' : 'F').join(', ');
                        answers.push(`[${bools}]`);
                    }
                });
                html += answers.join(' &nbsp;|&nbsp; ');
                html += `</div>`;
            });
            html += `</div>`;
        });
        html += `</div>`;
        div.innerHTML = html;
        return div;
    }

    function showDay(dayId, btn) {
        currentDayId = dayId;
        const ph = document.getElementById('placeholder');
        if (ph) ph.style.display = 'none';
        
        document.querySelectorAll('.day-content').forEach(d => d.classList.add('hidden'));
        document.querySelectorAll('.helper-hub-card').forEach(d => d.classList.add('hidden'));
        
        document.getElementById(dayId).classList.remove('hidden');
        
        // Show the correct Helper Hub on the screen if it's Friday
        if (dayId.includes('fri')) {
            const weekMatch = dayId.match(/-w(\d+)-/);
            if (weekMatch) {
                const hhCard = document.getElementById(`hh-w${weekMatch[1]}`);
                if (hhCard) hhCard.classList.remove('hidden');
            }
        }
        
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('footer-controls').style.display = 'flex';
        
        if (!attempts[dayId]) attempts[dayId] = 0;
        resetUI(dayId);
    }

    // --- DOM BUILDERS ---
    function formatText(t) { 
        if (!t) return t;
        t = t.replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '<span class="inline-frac"><span class="num">$1</span><span class="den">$2</span></span>');
        return t.replace(/□|\[box\]/g, '<span class="unknown-square"></span>'); 
    }

    function createProblem(p, type, overrideText = null) {
        const div = document.createElement('div'); div.className = 'math-problem';
        let inner = "";

        if (p.svg) inner += `<div style="text-align: center; width: 100%; margin-bottom: 15px;">${p.svg}</div>`;
        if (p.table) inner += `<div class="pattern-table-container" style="display:flex; justify-content:center; width:100%; margin: 15px 0;">${drawPatternTable(p.table)}</div>`;
        if (p.patternLine) inner += `<div style="text-align: center; width: 100%; margin-bottom: 15px;">${drawPatternLine(p.patternLine.values, p.patternLine.answers)}</div>`;

        let rawText = overrideText !== null ? overrideText : p.text;
        
        if (rawText) {
            if (type === "fraction-input" && rawText.includes('[frac-box]')) {
                const fHtml = `<div class="frac-box-container" data-answer="${p.answer}">
                    <input type="number" class="frac-input num-in">
                    <div class="frac-line"></div>
                    <input type="number" class="frac-input den-in">
                </div>`;
                let textWithFracBox = rawText.replace('[frac-box]', fHtml);
                inner += formatText(textWithFracBox);
            } else {
                const input = `<input type="text" class="input-box" data-answer="${p.answer}">`;
                let formatted = formatText(rawText);
                
                if (rawText.includes('[box]')) {
                    inner += formatted.replace('<span class="unknown-square"></span>', input);
                } else if (p.answer) { 
                    inner += formatted + ' ' + input;
                } else {
                    inner += formatted; 
                }
            }
        } else if (p.answer) {
             inner += `<div style="text-align:center; margin-top:10px;"><input type="text" class="input-box" data-answer="${p.answer}"></div>`;
        }

        div.innerHTML = inner;
        return div;
    }

    function createGrid(rows) {
        let h = `<table class="caaspp-grid"><tr><th style="width:50%">Statement / Equation</th><th>True</th><th>False</th></tr>`;
        rows.forEach(r => {
            const tBox = `<label class="checkbox-container"><input type="checkbox" data-correct="${r.correct}"><span class="checkmark"></span></label>`;
            const fBox = `<label class="checkbox-container"><input type="checkbox" data-correct="${!r.correct}"><span class="checkmark"></span></label>`;
            h += `<tr data-type="grid-row"><td>${formatText(r.text)}</td><td>${tBox}</td><td>${fBox}</td></tr>`;
        });
        return createElementFromHTML(h + '</table>');
    }

    function createDouble(sec) {
        return createElementFromHTML(`<div class="double-input-container"><div class="double-input-prompt">${formatText(sec.prompt)}</div><p style="margin-top:15px;color:#666">Enter one number in each box:</p><div class="box-row"><input class="input-box" data-answer="${sec.answers[0]}"><input class="input-box" data-answer="${sec.answers[1]}"></div></div>`);
    }

    function createMC(sec) {
        const div = document.createElement('div'); div.setAttribute('data-type', 'mc-container');
        const grp = 'mc_' + Math.random().toString(36).substr(2,9);
        sec.options.forEach(opt => {
            const row = document.createElement('div'); row.className = 'mc-option';
            const content = opt.svg ? `<div style="margin-left:10px;">${opt.svg}</div>` : `<span>${formatText(opt.text)}</span>`;
            row.innerHTML = `<input type="radio" name="${grp}" data-correct="${opt.correct}">${content}`;
            row.onclick = () => row.querySelector('input').checked = true;
            div.appendChild(row);
        });
        return div;
    }
    
    function createElementFromHTML(htmlString) {
        const div = document.createElement('div'); div.innerHTML = htmlString.trim();
        return div.firstChild; 
    }

    function parseFrac(str) {
        if (str.includes('/')) {
            let pts = str.split('/');
            return parseFloat(pts[0]) / parseFloat(pts[1]);
        }
        return parseFloat(str);
    }

    // --- CHECKING LOGIC ---
    function resetUI(dayId) {
        const fb = document.getElementById('feedback-box');
        const btn = document.querySelector('.check-btn');
        if (attempts[dayId] >= 2) {
             fb.className = "feedback-box info"; fb.textContent = "Review your answers above.";
             btn.disabled = true; btn.textContent = "Completed";
             revealAnswers(document.getElementById(dayId));
        } else {
            fb.style.display = 'none'; btn.disabled = false; btn.textContent = "Check Answers";
        }
    }

    function checkAnswers() {
        const c = document.getElementById(currentDayId);
        let allGood = true;

        c.querySelectorAll('input[type="text"].input-box').forEach(i => {
            let val = i.value.trim();
            let ans = i.dataset.answer;
            let isCorrect = false;

            if (val === "") {
                isCorrect = false;
            } else if (ans.startsWith('>')) {
                isCorrect = parseInt(val) > parseInt(ans.substring(1));
            } else if (ans.startsWith('<')) {
                isCorrect = parseInt(val) < parseInt(ans.substring(1));
            } else {
                isCorrect = (val === ans);
            }

            if(isCorrect){ i.className='input-box correct'; }
            else{ i.className='input-box incorrect'; allGood=false; }
        });

        c.querySelectorAll('.frac-box-container').forEach(fi => {
            let num = fi.querySelector('.num-in').value.trim();
            let den = fi.querySelector('.den-in').value.trim();
            let ansStr = fi.dataset.answer;
            let isCorrect = false;

            if (num !== "" && den !== "" && parseFloat(den) !== 0) {
                let userVal = parseFloat(num) / parseFloat(den);
                let targetVal = parseFrac(ansStr);
                if (Math.abs(userVal - targetVal) < 0.0001) isCorrect = true;
            }

            if (isCorrect) {
                fi.classList.add('correct'); fi.classList.remove('incorrect');
            } else {
                fi.classList.add('incorrect'); fi.classList.remove('correct');
                allGood = false;
            }
        });

        c.querySelectorAll('tr[data-type="grid-row"]').forEach(row => {
            row.querySelectorAll('.checkbox-container').forEach(l => l.classList.remove('correct-check', 'incorrect-check'));
            
            const [tWrap, fWrap] = row.querySelectorAll('.checkbox-container');
            const [tIn, fIn] = row.querySelectorAll('input');
            const isCorrect = (tIn.dataset.correct==='true' && tIn.checked && !fIn.checked) || (tIn.dataset.correct==='false' && !tIn.checked && fIn.checked);
            
            if (tIn.checked) {
                if(tIn.dataset.correct === 'true') tWrap.classList.add('correct-check');
                else tWrap.classList.add('incorrect-check');
            }
            if (fIn.checked) {
                if(fIn.dataset.correct === 'true') fWrap.classList.add('correct-check');
                else fWrap.classList.add('incorrect-check');
            }
            if(!isCorrect) allGood=false;
        });

        c.querySelectorAll('div[data-type="mc-container"]').forEach(mc => {
            let mcHit = false;
            mc.querySelectorAll('.mc-option').forEach(opt => {
                opt.className = 'mc-option';
                const r = opt.querySelector('input');
                if(r.checked) {
                    if(r.dataset.correct==='true'){ opt.classList.add('mc-correct'); mcHit=true; }
                    else opt.classList.add('mc-incorrect');
                }
            });
            if(!mcHit) allGood = false;
        });

        const fb = document.getElementById('feedback-box');
        const btn = document.querySelector('.check-btn');

        if(allGood) {
            fb.className="feedback-box correct"; fb.textContent="🎉 PERFECT! Great job!";
            btn.disabled=true; btn.textContent="Completed"; attempts[currentDayId]=2;
        } else {
            attempts[currentDayId]++;
            if(attempts[currentDayId]<2) { fb.className="feedback-box warning"; fb.textContent="🤔 Not quite. Try again! (Attempt 1 of 2)"; }
            else { fb.className="feedback-box info"; fb.textContent="❌ Nice try! Here are the correct answers."; revealAnswers(c); btn.disabled=true; btn.textContent="Completed"; }
        }
    }

    function revealAnswers(c) {
        c.querySelectorAll('input[type="text"].input-box').forEach(i => {
            if(!i.parentNode.querySelector('.correction-text')) {
                let ansText = i.dataset.answer;
                if (ansText.startsWith('>')) ansText = `Any number > ${ansText.substring(1)}`;
                if (ansText.startsWith('<')) ansText = `Any number < ${ansText.substring(1)}`;
                i.parentNode.insertAdjacentHTML('beforeend', `<span class="correction-text">Ans: ${ansText}</span>`);
            }
        });
        
        c.querySelectorAll('.frac-box-container').forEach(fi => {
            if(!fi.parentNode.querySelector('.correction-text')) {
                fi.parentNode.insertAdjacentHTML('beforeend', `<span class="correction-text">Ans: ${fi.dataset.answer} (or equivalent)</span>`);
            }
        });

        c.querySelectorAll('input[type="checkbox"][data-correct="true"]').forEach(box => {
            const label = box.closest('.checkbox-container');
            if(!label.parentNode.querySelector('.grid-answer-indicator')) {
                label.parentNode.insertAdjacentHTML('beforeend', `<div class="grid-answer-indicator" style="color:#27ae60; font-weight:bold; font-size:14px; margin-top:5px;">(Correct)</div>`);
            }
        });
        
        c.querySelectorAll('input[type="radio"][data-correct="true"]').forEach(r => r.closest('.mc-option').classList.add('mc-correct'));
    }

    // --- EXTRA PRACTICE ---
    let currentDrills = [];
    function startExtraPractice() {
        const c = document.getElementById('extraPracticeContainer'), g = document.getElementById('drillGrid'), fb = document.getElementById('drillFeedback');
        c.classList.remove('hidden'); fb.style.display='none'; c.scrollIntoView({behavior:'smooth'});
        g.innerHTML = ''; currentDrills = [];

        for(let i=0; i<15; i++) {
            let n1 = Math.ceil(Math.random()*10), n2 = Math.ceil(Math.random()*10), isMult = Math.random()>.5;
            let val = isMult ? n1*n2 : n1, eq = isMult ? `${n1} &times; ${n2} = ${val}` : `${n1*n2} &divide; ${n2} = ${n1}`;
            let parts = isMult ? [n1, n2, val] : [n1*n2, n2, n1];
            let missing = Math.floor(Math.random()*3); 
            
            let htmlParts = [isMult?n1:n1*n2, isMult?'&times;':'&divide;', isMult?n2:n2, '=', isMult?val:n1];
            let hIdx = missing === 0 ? 0 : missing === 1 ? 2 : 4;
            let ans = parts[missing];
            
            htmlParts[hIdx] = `<input type="number" id="d-${i}" class="drill-input">`;
            currentDrills.push({id:`d-${i}`, ans: ans});
            g.innerHTML += `<div class="drill-card">${htmlParts.join(' ')}</div>`;
        }
    }

    function checkDrills() {
        let score = 0;
        currentDrills.forEach(d => {
            const el = document.getElementById(d.id), p = el.parentElement;
            if(parseInt(el.value) === d.ans) { score++; p.style.border="2px solid #27ae60"; p.style.background="#e8f5e9"; }
            else { p.style.border="2px solid #e74c3c"; p.style.background="#fadbd8"; }
        });
        const fb = document.getElementById('drillFeedback');
        fb.style.display = 'block';
        fb.className = score===15 ? "feedback-box correct" : "feedback-box warning";
        fb.textContent = score===15 ? "🌟 PERFECT! 15/15! 🌟" : `You got ${score} out of 15 correct.`;
    }

    // --- INITIALIZATION ---
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        let modIndex = parseInt(urlParams.get('module'));
        if (isNaN(modIndex)) modIndex = 0;
        selectModule(modIndex);
    };

</script>
</body>
</html>
