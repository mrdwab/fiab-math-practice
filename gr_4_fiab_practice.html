<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        @media print {
            /* Fix for long geometry words in matrix columns */
            .match-grid td:first-child {
                font-size: 13px !important;
                padding: 4px 6px !important;
            }
            .match-grid th, .caaspp-grid th { background-color: #f4f4f4 !important; }

            /* Hide the "W" placeholder when printing */
            input::placeholder { color: transparent !important; }
            input::-webkit-input-placeholder { color: transparent !important; }

            /* Force all SVG shapes to white fill with black borders */
            svg.geometry-shape path, svg.geometry-shape polygon, svg.geometry-shape rect,
            .helper-hub svg path, .helper-hub svg polyline, .helper-hub svg rect,
            svg path, svg polygon, svg rect, svg polyline {
                fill: #ffffff !important;
                stroke: #000000 !important;
            }
            svg line, .helper-hub svg line { stroke: #000000 !important; }
        }
    </style>
    <script>
        // Helper function for rendering perfectly aligned stacked math problems
        function stackedHTML(top, bottom, operator) {
            return `<table style="display: inline-table; border-collapse: collapse; font-size: 22px; margin-right: 15px; font-family: 'Droid Sans Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums;">
                <tr>
                    <td style="border: none; padding: 0 15px 5px 5px;"></td>
                    <td style="border: none; text-align: right; padding: 0 5px 5px 0;">${top}</td>
                </tr>
                <tr>
                    <td style="border-bottom: 2px solid black; padding: 0 15px 5px 5px;">${operator}</td>
                    <td style="border-bottom: 2px solid black; text-align: right; padding: 0 5px 5px 0;">${bottom}</td>
                </tr>
            </table>`;
        }

        // Global Helper functions for inline fractions
        function f(n, d) {
            return `<div class="fraction-wrap" style="font-size: 1.1em; margin: 0 4px;"><div class="frac-top">${n}</div><div class="frac-bottom">${d}</div></div>`;
        }
        
        function mf(w, n, d) {
            return `<div class="mixed-text-container" style="font-size: 1.1em; display: inline-flex;"><span class="whole-part">${w}</span>${f(n, d)}</div>`;
        }

        function decimalToFractionStr(dec) {
            let w = Math.floor(dec);
            let fPart = dec - w;
            let fr = "";
            // Precision check for common fractions
            if (Math.abs(fPart - 0.75) < 0.01) fr = "3/4";
            else if (Math.abs(fPart - 0.5) < 0.01) fr = "1/2";
            else if (Math.abs(fPart - 0.25) < 0.01) fr = "1/4";
            else if (Math.abs(fPart - 0.333) < 0.01 || Math.abs(fPart - 0.3333) < 0.01) fr = "1/3";
            else if (Math.abs(fPart - 0.666) < 0.01 || Math.abs(fPart - 0.6667) < 0.01) fr = "2/3";
            else if (Math.abs(fPart - 0.2) < 0.01) fr = "1/5";
            else if (Math.abs(fPart - 0.4) < 0.01) fr = "2/5";
            else if (Math.abs(fPart - 0.6) < 0.01) fr = "3/5";
            else if (Math.abs(fPart - 0.8) < 0.01) fr = "4/5";
            else if (Math.abs(fPart - 0.125) < 0.01) fr = "1/8";
            else if (Math.abs(fPart - 0.375) < 0.01) fr = "3/8";
            else if (Math.abs(fPart - 0.625) < 0.01) fr = "5/8";
            else if (Math.abs(fPart - 0.875) < 0.01) fr = "7/8";
            else return String(dec); // Fallback to decimal if it's not a clean fraction

            if (w > 0 && fr !== "") return `${w} ${fr}`;
            if (w > 0) return `${w}`;
            return fr;
        }

        // GLOBAL SHAPE LIBRARY FOR SVG GENERATION
        const shapes = {
            rect: { type: 'shape', name: 'Rectangle', points: "15,25 85,25 85,75 15,75" },
            parallelogram: { type: 'shape', name: 'Parallelogram', points: "20,75 80,75 90,25 30,25" },
            kite: { type: 'shape', name: 'Kite', points: "50,5 80,40 50,95 20,40" },
            rightTri: { type: 'shape', name: 'Right Triangle', points: "20,80 80,80 20,20" },
            acuteTri: { type: 'shape', name: 'Acute Triangle', points: "30,80 70,80 50,10" },
            obtuseTri: { type: 'shape', name: 'Obtuse Triangle', points: "20,80 95,80 10,40" },
            hexagon: { type: 'shape', name: 'Hexagon', points: "25,15 75,15 95,50 75,85 25,85 5,50" },
            octagon: { type: 'shape', name: 'Octagon', points: "30,10 70,10 90,30 90,70 70,90 30,90 10,70 10,30" },
            trapezoid: { type: 'shape', name: 'Trapezoid', points: "20,80 80,80 60,30 40,30" },
            rightTrapezoid: { type: 'shape', name: 'Right Trapezoid', points: "20,80 80,80 60,30 20,30" },
            heart: { type: 'shape', name: 'Heart', path: "M 50,90 C 50,90 10,60 10,30 A 20,20 0 0,1 50,30 A 20,20 0 0,1 90,30 C 90,60 50,90 50,90 Z" },
            arrow: { type: 'shape', name: 'Arrow', points: "10,40 50,40 50,20 90,50 50,80 50,60 10,60" },
            chevron: { type: 'shape', name: 'Chevron', points: "20,20 60,50 20,80 50,80 90,50 50,20" },
            star: { type: 'shape', name: 'Star', points: "50,5 61,35 95,35 68,55 78,85 50,65 22,85 32,55 5,35 39,35" },
            rhombus: { type: 'shape', name: 'Rhombus', points: "50,10 85,50 50,90 15,50" }
        };
    </script>
</head>

    <script>
        const appData = {
            modules: [
                typeof module1 !== 'undefined' ? module1 : { id: "m1", name: "Module 1", weeks: [] },
                typeof module2 !== 'undefined' ? module2 : { id: "m2", name: "Module 2", weeks: [] },
                typeof module3 !== 'undefined' ? module3 : { id: "m3", name: "Module 3", weeks: [] },
                typeof module4 !== 'undefined' ? module4 : { id: "m4", name: "Module 4", weeks: [] },
                typeof module5 !== 'undefined' ? module5 : { id: "m5", name: "Module 5", weeks: [] },
                typeof module6 !== 'undefined' ? module6 : { id: "m6", name: "Module 6", weeks: [] },
                typeof module7 !== 'undefined' ? module7 : { id: "m7", name: "Module 7", weeks: [] },
                typeof module8 !== 'undefined' ? module8 : { id: "m8", name: "Module 8", weeks: [] },
                typeof module9 !== 'undefined' ? module9 : { id: "m9", name: "Module 9", weeks: [] },
                typeof module10 !== 'undefined' ? module10 : { id: "m10", name: "Module 10", weeks: [] }
            ]
        };

        // --- GLOBAL VARIABLES ---
        let currentModuleIndex = -1;
        let currentDayId = '';
        let currentVersion = 'A'; 
        let attempts = {};

        // --- DOM BUILDERS ---

        function createMultipleChoice(section, qIndex) {
            const div = document.createElement('div');
            div.className = 'mc-container';
            div.setAttribute('data-type', 'multiple-choice');
            
            section.options.forEach((opt, i) => {
                const label = document.createElement('label');
                label.className = 'mc-label';
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `mc_${currentDayId}_${qIndex}_${currentVersion}`;
                radio.value = i;
                radio.setAttribute('data-correct', opt.correct);
                
                const span = document.createElement('span');
                span.innerHTML = opt.text;
                
                label.appendChild(radio);
                label.appendChild(span);
                div.appendChild(label);
            });
            return div;
        }
        
        function createPieChart(n, d) {
            const size = 60;
            const r = size / 2;
            const cx = r, cy = r;
            const container = document.createElement('div'); container.className = 'pie-chart-container';
            let svgContent = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
            svgContent += `<circle cx="${cx}" cy="${cy}" r="${r-1}" fill="white" stroke="black" stroke-width="1.5"/>`;
            const step = (Math.PI * 2) / d;
            for (let i = 0; i < d; i++) {
                const startAngle = i * step - (Math.PI / 2);
                const endAngle = (i + 1) * step - (Math.PI / 2);
                const x1 = cx + (r-1) * Math.cos(startAngle);
                const y1 = cy + (r-1) * Math.sin(startAngle);
                const x2 = cx + (r-1) * Math.cos(endAngle);
                const y2 = cy + (r-1) * Math.sin(endAngle);
                const fillColor = i < n ? '#3498db' : 'none';
                const largeArc = step > Math.PI ? 1 : 0;
                svgContent += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r-1} ${r-1} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${fillColor}" stroke="black" stroke-width="1" />`;
            }
            svgContent += `</svg>`;
            container.innerHTML = svgContent;
            return container;
        }

        function createShapeSVG(shape) {
            const size = shape.size || 100;
            let svg = `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block; margin: 0 auto; overflow:visible;">
                <defs>
                    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#e74c3c" /></marker>
                    <marker id="arrowhead-start" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><polygon points="6,0 0,3 6,6" fill="#e74c3c" /></marker>
                </defs>`;
            
            if (shape.path) {
                svg += `<path d="${shape.path}" fill="${shape.fill || '#e0f7fa'}" stroke="${shape.stroke || '#00bcd4'}" stroke-width="2"/>`;
            } else if (shape.points) {
                svg += `<polygon points="${shape.points}" fill="${shape.fill || '#e0f7fa'}" stroke="${shape.stroke || '#00bcd4'}" stroke-width="2"/>`;
            }

            if (shape.symmetryLine) {
                svg += `<line x1="${shape.symmetryLine.x1}" y1="${shape.symmetryLine.y1}" x2="${shape.symmetryLine.x2}" y2="${shape.symmetryLine.y2}" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-start="url(#arrowhead-start)" marker-end="url(#arrowhead)"/>`;
            } else if (shape.lines) {
                 shape.lines.forEach(l => {
                     svg += `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>`;
                 });
            }
            svg += `</svg>`;
            return svg;
        }

        function createRectModel(rows, cols, shaded, fillMode = 'row') {
            const w = 150, h = 80;
            const cellW = w / cols;
            const cellH = h / rows;
            const container = document.createElement('div'); container.className = 'rect-model-container';
            let svg = `<svg width="${w}" height="${h}" style="border: 2px solid black;">`;
            for(let r=0; r<rows; r++){
                for(let c=0; c<cols; c++){
                    let isShaded = false;
                    if (fillMode === 'col') { if ((c * rows + r) < shaded) isShaded = true; }
                    else { if ((r * cols + c) < shaded) isShaded = true; }
                    const color = isShaded ? '#3498db' : 'white';
                    svg += `<rect x="${c*cellW}" y="${r*cellH}" width="${cellW}" height="${cellH}" fill="${color}" stroke="black" stroke-width="1"/>`;
                }
            }
            svg += `</svg>`;
            container.innerHTML = svg;
            return container;
        }

        function createNumberLine(section) {
            const width = 600; const margin = 40; const range = section.end - section.start; const scale = (width - 2 * margin) / range;
            const step = section.step || 0.1; const targetX = margin + (section.target - section.start) * scale;
            const arrowSize = 10;
            const leftArrow = `<polygon points="${margin},35 ${margin},45 ${margin - arrowSize},40" fill="black" />`;
            const rightArrow = `<polygon points="${width - margin},35 ${width - margin},45 ${width - margin + arrowSize},40" fill="black" />`;
            let ticks = []; const stepCount = Math.round(range / step);
            for (let i = 0; i <= stepCount; i++) {
                let val = section.start + (i * step); val = parseFloat(val.toFixed(2));
                let x = margin + (val - section.start) * scale;
                let isMajor = false;
                if (step === 0.01) { if (i % 5 === 0) isMajor = true; } else { if (Number.isInteger(val) || (range <= 2 && i % 5 === 0)) isMajor = true; }
                let y2 = isMajor ? 60 : 50; let label = '';
                if (isMajor) { label = `<text x="${x}" y="85" text-anchor="middle" font-size="16">${val}</text>`; }
                ticks.push(`<line x1="${x}" y1="40" x2="${x}" y2="${y2}" stroke="black" stroke-width="${isMajor ? 3 : 2}" />${label}`);
            }
            const svgHTML = `
            <div class="number-line-container">
                <svg width="100%" height="100%" viewBox="0 0 ${width} 100" style="background:#fff; border-radius:10px; max-width:${width}px;">
                    <line x1="${margin}" y1="40" x2="${width - margin}" y2="40" stroke="black" stroke-width="3" />
                    ${leftArrow} ${rightArrow} ${ticks.join('')}
                    <circle cx="${targetX}" cy="40" r="6" fill="#e74c3c" />
                    <text x="${targetX}" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#e74c3c">${section.label}</text>
                </svg>
            </div>
            <div style="text-align:center; margin-top:10px; font-size:18px;">
                ${section.label} = <input type="text" class="std-input" data-answer="${section.ans}">
            </div>`;
            const div = document.createElement('div'); div.innerHTML = svgHTML; return div;
        }

        // SVG GENERATOR: Angles with Point Labels and Right Angle Support
        function createAngleDiagram(section) {
            const size = 200; const cx = 100, cy = 100; const r = 70;
            let svg = `<svg width="100%" height="100%" viewBox="0 0 ${size} ${size}" style="max-width:200px; display:block; margin: 0 auto; overflow:visible;">`;
            
            const getXY = (angle) => {
                const rad = -angle * Math.PI / 180;
                return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
            };

            if (section.arcs) {
                section.arcs.forEach((arc, i) => {
                    if (arc.isRight) {
                        const arcR = 15;
                        const sRad = -arc.start * Math.PI / 180;
                        const eRad = -arc.end * Math.PI / 180;
                        const p1x = cx + arcR * Math.cos(sRad);
                        const p1y = cy + arcR * Math.sin(sRad);
                        const p2x = cx + arcR * Math.cos(eRad);
                        const p2y = cy + arcR * Math.sin(eRad);
                        const px = cx + arcR * Math.cos(sRad) + arcR * Math.cos(eRad);
                        const py = cy + arcR * Math.sin(sRad) + arcR * Math.sin(eRad);
                        svg += `<polyline points="${p1x},${p1y} ${px},${py} ${p2x},${p2y}" fill="none" stroke="${arc.color || '#e74c3c'}" stroke-width="2"/>`;
                    } else {
                        const arcR = arc.radius || (25 + (i * 10)); 
                        const sX = cx + arcR * Math.cos(-arc.start * Math.PI / 180);
                        const sY = cy + arcR * Math.sin(-arc.start * Math.PI / 180);
                        const eX = cx + arcR * Math.cos(-arc.end * Math.PI / 180);
                        const eY = cy + arcR * Math.sin(-arc.end * Math.PI / 180);
                        const largeArc = (arc.end - arc.start) > 180 ? 1 : 0;
                        svg += `<path d="M ${sX} ${sY} A ${arcR} ${arcR} 0 ${largeArc} 0 ${eX} ${eY}" fill="none" stroke="${arc.color || '#e74c3c'}" stroke-width="2"/>`;
                        
                        if (arc.label) {
                            const midAngle = (arc.start + arc.end) / 2;
                            const labelR = arcR + 18;
                            const lX = cx + labelR * Math.cos(-midAngle * Math.PI / 180);
                            const lY = cy + labelR * Math.sin(-midAngle * Math.PI / 180);
                            svg += `<text x="${lX}" y="${lY + 5}" text-anchor="middle" font-size="14" font-weight="bold">${arc.label}</text>`;
                        }
                    }
                });
            }

            if (section.rays) {
                section.rays.forEach((ray, idx) => {
                    const pt = getXY(ray);
                    svg += `<line x1="${cx}" y1="${cy}" x2="${pt.x}" y2="${pt.y}" stroke="black" stroke-width="2"/>`;
                    const rad = -ray * Math.PI / 180;
                    const arrowL1 = rad + Math.PI*0.85;
                    const arrowL2 = rad - Math.PI*0.85;
                    const ax1 = pt.x + 8 * Math.cos(arrowL1);
                    const ay1 = pt.y + 8 * Math.sin(arrowL1);
                    const ax2 = pt.x + 8 * Math.cos(arrowL2);
                    const ay2 = pt.y + 8 * Math.sin(arrowL2);
                    svg += `<polygon points="${pt.x},${pt.y} ${ax1},${ay1} ${ax2},${ay2}" fill="black"/>`;
                    
                    if (section.rayLabels && section.rayLabels[idx]) {
                        const lx = cx + (r + 15) * Math.cos(rad);
                        const ly = cy + (r + 15) * Math.sin(rad);
                        svg += `<text x="${lx}" y="${ly+5}" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">${section.rayLabels[idx]}</text>`;
                    }
                });
            }
            
            if (section.vertex) {
                svg += `<text x="${cx}" y="${cy+20}" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">${section.vertex}</text>`;
            }

            svg += `<circle cx="${cx}" cy="${cy}" r="4" fill="black"/></svg>`;

            const container = document.createElement('div');
            container.style.textAlign = 'center'; container.style.marginBottom = '15px';
            container.innerHTML = svg;
            if(section.problems) section.problems.forEach(prob => container.appendChild(createMixedRow(prob)));
            return container;
        }

        // SVG GENERATOR: Protractor Overhauled
        function createProtractor(section) {
            const w = 450, h = 240; const cx = 225, cy = 200, r = 130;
            let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" style="max-width:450px; display:block; margin: 0 auto; overflow:visible;">`;
            
            svg += `<path d="M ${cx-r-45} ${cy} A ${r+45} ${r+45} 0 0 1 ${cx+r+45} ${cy} Z" fill="#e0f7fa" stroke="#00bcd4" stroke-width="2" opacity="0.4"/>`;
            svg += `<path d="M ${cx-r-45} ${cy} L ${cx+r+45} ${cy}" stroke="#00bcd4" stroke-width="2"/>`;
            svg += `<path d="M ${cx-r+20} ${cy} A ${r-20} ${r-20} 0 0 1 ${cx+r-20} ${cy} Z" fill="none" stroke="#00bcd4" stroke-width="1"/>`;
            svg += `<circle cx="${cx}" cy="${cy}" r="4" fill="black"/>`;
            
            for (let i = 0; i <= 180; i+=5) {
                const rad = -i * Math.PI / 180;
                const isMajor = (i % 10 === 0);
                
                const tickStart = r;
                const tickEnd = isMajor ? r + 10 : r + 5;
                const x1 = cx + tickStart * Math.cos(rad); const y1 = cy + tickStart * Math.sin(rad);
                const x2 = cx + tickEnd * Math.cos(rad);   const y2 = cy + tickEnd * Math.sin(rad);
                svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#333" stroke-width="${isMajor ? 2 : 1}"/>`;
                
                if (isMajor) {
                    const outerNum = 180 - i;
                    const innerNum = i;
                    
                    const txOut = cx + (r + 25) * Math.cos(rad); 
                    const tyOut = cy + (r + 25) * Math.sin(rad);
                    svg += `<text x="${txOut}" y="${tyOut+5}" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle" transform="rotate(${i-90}, ${txOut}, ${tyOut})">${outerNum}</text>`;
                    
                    const txIn = cx + (r - 12) * Math.cos(rad); 
                    const tyIn = cy + (r - 12) * Math.sin(rad);
                    svg += `<text x="${txIn}" y="${tyIn+3}" font-size="10" font-family="sans-serif" text-anchor="middle" transform="rotate(${i-90}, ${txIn}, ${tyIn})" fill="#555">${innerNum}</text>`;
                }
            }
            
            if (section.arcs) {
                section.arcs.forEach(arc => {
                    if (arc.isRight) {
                        const arcR = 15;
                        const sRad = -arc.start * Math.PI / 180;
                        const eRad = -arc.end * Math.PI / 180;
                        const p1x = cx + arcR * Math.cos(sRad); const p1y = cy + arcR * Math.sin(sRad);
                        const p2x = cx + arcR * Math.cos(eRad); const p2y = cy + arcR * Math.sin(eRad);
                        const px = cx + arcR * Math.cos(sRad) + arcR * Math.cos(eRad);
                        const py = cy + arcR * Math.sin(sRad) + arcR * Math.sin(eRad);
                        svg += `<polyline points="${p1x},${p1y} ${px},${py} ${p2x},${p2y}" fill="none" stroke="${arc.color || '#27ae60'}" stroke-width="2"/>`;
                    } else {
                        const arcR = 40;
                        const sX = cx + arcR * Math.cos(-arc.start * Math.PI / 180);
                        const sY = cy + arcR * Math.sin(-arc.start * Math.PI / 180);
                        const eX = cx + arcR * Math.cos(-arc.end * Math.PI / 180);
                        const eY = cy + arcR * Math.sin(-arc.end * Math.PI / 180);
                        svg += `<path d="M ${sX} ${sY} A ${arcR} ${arcR} 0 0 0 ${eX} ${eY}" fill="none" stroke="#27ae60" stroke-width="3"/>`;
                        
                        if(arc.label) {
                            const midAngle = (arc.start + arc.end) / 2;
                            const lX = cx + (arcR + 15) * Math.cos(-midAngle * Math.PI / 180);
                            const lY = cy + (arcR + 15) * Math.sin(-midAngle * Math.PI / 180);
                            svg += `<text x="${lX}" y="${lY + 5}" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">${arc.label}</text>`;
                        }
                    }
                });
            }

            if (section.rays) {
                section.rays.forEach((angle, idx) => {
                    const rad = -angle * Math.PI / 180;
                    const px = cx + (r+50) * Math.cos(rad); const py = cy + (r+50) * Math.sin(rad);
                    svg += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#e74c3c" stroke-width="3"/>`;
                    
                    const arrowL1 = rad + Math.PI*0.85; const arrowL2 = rad - Math.PI*0.85;
                    const ax1 = px + 10 * Math.cos(arrowL1); const ay1 = py + 10 * Math.sin(arrowL1);
                    const ax2 = px + 10 * Math.cos(arrowL2); const ay2 = py + 10 * Math.sin(arrowL2);
                    svg += `<polygon points="${px},${py} ${ax1},${ay1} ${ax2},${ay2}" fill="#e74c3c"/>`;

                    if (section.rayLabels && section.rayLabels[idx]) {
                        const lx = cx + (r+65) * Math.cos(rad); const ly = cy + (r+65) * Math.sin(rad);
                        svg += `<text x="${lx}" y="${ly+6}" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">${section.rayLabels[idx]}</text>`;
                    }
                });
            }

            if (section.vertex) {
                svg += `<text x="${cx}" y="${cy+20}" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">${section.vertex}</text>`;
            }

            svg += `</svg>`;

            const container = document.createElement('div');
            container.style.textAlign = 'center'; container.style.marginBottom = '15px';
            container.innerHTML = svg;
            if(section.problems) section.problems.forEach(prob => container.appendChild(createMixedRow(prob)));
            return container;
        }

        // SVG GENERATOR: Line Plot with strictly horizontal fractions
        function createLinePlot(section) {
            const w = 500, h = 180;
            const marginX = 40, baseY = 120;
            const range = section.end - section.start;
            const scaleX = (w - 2 * marginX) / range;
            
            let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" style="max-width:500px; display:block; margin: 0 auto; overflow:visible;">`;
            
            svg += `<line x1="${marginX-15}" y1="${baseY}" x2="${w-marginX+15}" y2="${baseY}" stroke="black" stroke-width="3"/>`;
            
            const steps = Math.round(range * section.denominator);
            for(let i=0; i<=steps; i++) {
                const val = section.start + (i / section.denominator);
                const px = marginX + (val - section.start) * scaleX;
                const isWhole = Number.isInteger(val);
                const tickH = isWhole ? 10 : 5;
                svg += `<line x1="${px}" y1="${baseY}" x2="${px}" y2="${baseY + tickH}" stroke="black" stroke-width="2"/>`;
                
                if (isWhole) {
                    svg += `<text x="${px}" y="${baseY + 28}" text-anchor="middle" font-size="15" font-family="sans-serif">${val}</text>`;
                } else if (i % 2 === 0 || section.denominator <= 4 || section.denominator === 8) {
                    const whole = Math.floor(val);
                    const num = i % section.denominator;
                    
                    const fractionWidth = 14;
                    let cX = px;
                    
                    if (whole > 0) {
                        svg += `<text x="${px - 8}" y="${baseY + 28}" font-size="15" font-family="sans-serif" text-anchor="end">${whole}</text>`;
                        cX = px + 6; 
                    }
                    svg += `<text x="${cX}" y="${baseY + 18}" font-size="11" font-family="sans-serif" text-anchor="middle">${num}</text>`;
                    svg += `<line x1="${cX - fractionWidth/2}" y1="${baseY + 22}" x2="${cX + fractionWidth/2}" y2="${baseY + 22}" stroke="black" stroke-width="1"/>`;
                    svg += `<text x="${cX}" y="${baseY + 33}" font-size="11" font-family="sans-serif" text-anchor="middle">${section.denominator}</text>`;
                }
            }
            
            const counts = {};
            section.points.forEach(p => { counts[p] = (counts[p] || 0) + 1; });
            for(let p in counts) {
                const val = parseFloat(p);
                const px = marginX + (val - section.start) * scaleX;
                for(let i=0; i<counts[p]; i++) {
                    const py = baseY - 12 - (i * 20);
                    svg += `<text x="${px}" y="${py}" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#2c7be5">X</text>`;
                }
            }
            
            if (section.title) svg += `<text x="${w/2}" y="20" text-anchor="middle" font-size="16" font-weight="bold" font-family="sans-serif">${section.title}</text>`;
            if (section.xLabel) svg += `<text x="${w/2}" y="${h-5}" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#555">${section.xLabel}</text>`;
            
            svg += `</svg>`;
            
            const container = document.createElement('div');
            container.style.textAlign = 'center';
            container.style.marginBottom = '15px';
            container.innerHTML = svg;
            
            if(section.grid) container.appendChild(createGrid(section.grid));
            if(section.problems) section.problems.forEach(prob => container.appendChild(createMixedRow(prob)));
            
            return container;
        }

        // --- Core Builders ---

        function createFraction(seg) {
            const container = document.createElement('span'); 
            container.className = 'fraction-wrap';
            container.style.display = 'inline-flex';
            container.style.flexDirection = 'column';
            container.style.alignItems = 'center';
            container.style.verticalAlign = 'middle';
            container.style.margin = '0 4px'; 
            
            if (seg.w) {
                const wSpan = document.createElement('span'); 
                wSpan.className = 'whole-part'; 
                wSpan.innerHTML = seg.w;
                wSpan.style.marginRight = '4px';
                
                const wrapper = document.createElement('span'); 
                wrapper.className = 'mixed-text-container';
                wrapper.style.display = 'inline-flex';
                wrapper.style.alignItems = 'center';
                wrapper.style.verticalAlign = 'middle';
                
                const innerTop = document.createElement('span'); innerTop.className = 'frac-top'; innerTop.innerHTML = seg.n;
                const innerBot = document.createElement('span'); innerBot.className = 'frac-bottom'; innerBot.innerHTML = seg.d;
                
                container.appendChild(innerTop); container.appendChild(innerBot); 
                wrapper.appendChild(wSpan); wrapper.appendChild(container); 
                return wrapper;
            }
            
            const top = document.createElement('span'); top.className = 'frac-top';
            if (seg.n === 'box') { const inp = document.createElement('input'); inp.className = 'frac-input'; inp.setAttribute('data-answer', seg.ans || seg.ansN); top.appendChild(inp); }
            else { top.innerHTML = seg.n; }
            
            const bot = document.createElement('span'); bot.className = 'frac-bottom';
            if (seg.d === 'box') { const inp = document.createElement('input'); inp.className = 'frac-input'; inp.setAttribute('data-answer', seg.ansD); bot.appendChild(inp); }
            else { bot.innerHTML = seg.d; }
            
            container.appendChild(top); container.appendChild(bot); return container;
        }

        function createMixedRow(probData) {
            const rowDiv = document.createElement('div'); rowDiv.className = 'math-row';
            probData.segments.forEach(seg => {
                if (seg.type === 'text') { const span = document.createElement('span'); span.innerHTML = seg.val; rowDiv.appendChild(span); }
                else if (seg.type === 'input') { const inp = document.createElement('input'); inp.className = 'std-input'; inp.setAttribute('data-answer', seg.ans); rowDiv.appendChild(inp); }
                else if (seg.type === 'mixed_input') { rowDiv.appendChild(createMixedInput(seg.ans)); }
                else if (seg.type === 'fraction_group') { rowDiv.appendChild(createFractionInputGroup(seg.ans)); }
                else if (seg.type === 'fraction') { rowDiv.appendChild(createFraction(seg)); }
            });
            return rowDiv;
        }

        function createFractionInputGroup(correctValueDecimal) {
            const container = document.createElement('div'); container.className = 'fraction-input-group';
            container.setAttribute('data-answer', correctValueDecimal); container.setAttribute('data-type', 'fraction-check');
            const wrapper = document.createElement('div'); wrapper.className = 'fraction-wrap';
            const top = document.createElement('div'); top.className = 'frac-top';
            const numInp = document.createElement('input'); numInp.className = 'frac-input'; top.appendChild(numInp);
            const bot = document.createElement('div'); bot.className = 'frac-bottom';
            const denInp = document.createElement('input'); denInp.className = 'frac-input'; bot.appendChild(denInp);
            wrapper.appendChild(top); wrapper.appendChild(bot); container.appendChild(wrapper); return container;
        }

        function createMixedInput(correctValueDecimal) {
            const wrapper = document.createElement('div'); wrapper.className = 'mixed-input-group';
            wrapper.setAttribute('data-answer', correctValueDecimal); wrapper.setAttribute('data-type', 'mixed-check');
            const wholeInp = document.createElement('input'); wholeInp.className = 'mixed-whole-input'; wholeInp.placeholder = "W";
            const fracWrap = document.createElement('div'); fracWrap.className = 'fraction-wrap';
            const top = document.createElement('div'); top.className = 'frac-top';
            const numInp = document.createElement('input'); numInp.className = 'frac-input'; top.appendChild(numInp);
            const bot = document.createElement('div'); bot.className = 'frac-bottom';
            const denInp = document.createElement('input'); denInp.className = 'frac-input'; bot.appendChild(denInp);
            fracWrap.appendChild(top); fracWrap.appendChild(bot); wrapper.appendChild(wholeInp); wrapper.appendChild(fracWrap); return wrapper;
        }

        function createGrid(section) {
            const table = document.createElement('table'); table.className = 'caaspp-grid';
            const col0Label = section.col0 || 'Expression'; 
            const col1Label = section.col1 || 'True';
            const col2Label = section.col2 || 'False';
            
            table.innerHTML = `<tr><th style="width: 50%">${col0Label}</th><th>${col1Label}</th><th>${col2Label}</th></tr>`;
            section.rows.forEach(row => {
                const tr = document.createElement('tr'); tr.setAttribute('data-type', 'grid-row');
                const tdLabel = document.createElement('td');
                if (row.segments) {
                    const mixedCont = document.createElement('span'); 
                    row.segments.forEach(seg => {
                        if (seg.type === 'text') { const s = document.createElement('span'); s.innerHTML = seg.val; mixedCont.appendChild(s); }
                        else if (seg.type === 'fraction') { mixedCont.appendChild(createFraction(seg)); }
                    });
                    tdLabel.appendChild(mixedCont);
                } else if (row.shape) {
                    tdLabel.innerHTML = createShapeSVG(row.shape);
                    tdLabel.style.textAlign = 'center';
                } else { tdLabel.innerHTML = row.text; }
                tr.appendChild(tdLabel);
                tr.innerHTML += `<td><input type="checkbox" data-correct="${row.correct}"></td><td><input type="checkbox" data-correct="${!row.correct}"></td>`;
                table.appendChild(tr);
            });
            return table;
        }

        function createMatchGrid(section) {
            const table = document.createElement('table'); table.className = 'match-grid'; table.setAttribute('data-type', 'match-grid');
            const thead = document.createElement('tr');
            const thCorner = document.createElement('th'); thCorner.className = 'corner-cell'; thead.appendChild(thCorner);
            section.colHeaders.forEach(col => {
                const th = document.createElement('th');
                if (col.type === 'pie') { th.appendChild(createPieChart(col.n, col.d)); }
                else if (col.type === 'fraction') { th.appendChild(createFraction(col)); }
                else if (col.type === 'shape') { th.innerHTML = createShapeSVG(col); }
                else { th.innerText = col.val; }
                thead.appendChild(th);
            });
            table.appendChild(thead);
            section.rows.forEach((rowData, rIdx) => {
                const tr = document.createElement('tr'); tr.setAttribute('data-row-idx', rIdx);
                const tdLabel = document.createElement('td');
                if (rowData.label.type === 'fraction') { tdLabel.appendChild(createFraction(rowData.label)); }
                else if (rowData.label.type === 'shape') { tdLabel.innerHTML = createShapeSVG(rowData.label); tdLabel.style.textAlign = 'center'; } 
                else { tdLabel.innerHTML = rowData.label.val; }
                tr.appendChild(tdLabel);
                rowData.matches.forEach(isMatch => {
                    const td = document.createElement('td');
                    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.setAttribute('data-correct', isMatch);
                    td.appendChild(cb); tr.appendChild(td);
                });
                table.appendChild(tr);
            });
            return table;
        }

        // --- ANSWER KEY GENERATOR ---
        function generateAnswerKey(module, weeksData) {
            const akContainer = document.getElementById('answer-key-section');
            if (!akContainer) return;
            akContainer.innerHTML = ''; 
            
            const title = document.createElement('h2');
            title.className = 'ak-title';
            title.innerText = `Answer Key: ${module.name} (Version ${currentVersion})`;
            akContainer.appendChild(title);

            const akColumnsContainer = document.createElement('div');
            akColumnsContainer.style.display = 'flex';
            akColumnsContainer.style.gap = '40px';
            akColumnsContainer.style.width = '100%';
            akContainer.appendChild(akColumnsContainer);

            const week1Col = document.createElement('div');
            week1Col.style.flex = '1';
            const week2Col = document.createElement('div');
            week2Col.style.flex = '1';

            akColumnsContainer.appendChild(week1Col);
            akColumnsContainer.appendChild(week2Col);

            weeksData.forEach(week => {
                const targetCol = (week.weekNum === 1) ? week1Col : week2Col;
                const weekTitle = document.createElement('h3');
                weekTitle.innerText = `Week ${week.weekNum}`;
                weekTitle.style.borderBottom = '1px solid #000';
                weekTitle.style.marginTop = '0';
                targetCol.appendChild(weekTitle);

                week.days.forEach(day => {
                    const dayBlock = document.createElement('div');
                    dayBlock.className = 'ak-day-block';
                    const dayTitle = document.createElement('div');
                    dayTitle.className = 'ak-day-title';
                    dayTitle.innerText = day.title;
                    dayBlock.appendChild(dayTitle);
                    const list = document.createElement('ol');
                    list.className = 'ak-list';
                    
                    day.sections.forEach(section => {
                        let answers = [];
                        
                        if (section.type === 'mixed_row' || section.type === 'word_problem' || section.type === 'rect_model_equiv' || section.type === 'angle_diagram' || section.type === 'protractor' || section.type === 'line_plot') {
                            const probs = section.problems || [];
                            probs.forEach(p => {
                                if (p.segments) {
                                    let segAnswers = [];
                                    let hasQuotient = false;
                                    let hasRemainder = false;
                                    
                                    p.segments.forEach(seg => {
                                        if (seg.type === 'text' && typeof seg.val === 'string') {
                                            if (seg.val.includes('Quotient')) hasQuotient = true;
                                            if (seg.val.includes('Remainder')) hasRemainder = true;
                                        }

                                        if (seg.ans || seg.ak) {
                                            let baseAns = seg.ak ? String(seg.ak) : String(seg.ans);
                                            let a = baseAns.replace(/\|/g, ' or ');
                                            
                                            if (!seg.ak) {
                                                let num = parseFloat(a);
                                                if (!isNaN(num)) a = decimalToFractionStr(num);
                                            }
                                            segAnswers.push(a);
                                        }
                                    });

                                    if(segAnswers.length > 0) {
                                        if (hasQuotient && hasRemainder && segAnswers.length === 2) {
                                            answers.push(`${segAnswers[0]} R${segAnswers[1]}`);
                                        } else {
                                            answers.push(segAnswers.join(', '));
                                        }
                                    }

                                } else if (p.ans) {
                                    let a = String(p.ans);
                                    let num = parseFloat(a);
                                    if (!isNaN(num)) a = decimalToFractionStr(num);
                                    answers.push(a);
                                }
                            });
                        } 
                        
                        if (section.type === 'grid' || section.grid) {
                            let gridData = section.grid || section;
                            let gridAns = [];
                            gridData.rows.forEach(r => {
                                gridAns.push(r.correct ? (gridData.col1 || 'True') : (gridData.col2 || 'False'));
                            });
                            answers.push(gridAns.join(', '));
                        } 
                        
                        if (section.type === 'matrix_match') {
                            let matchAns = [];
                            section.rows.forEach(r => {
                                r.matches.forEach((m, idx) => {
                                    if (m) {
                                        let col = section.colHeaders[idx];
                                        let cVal = (col.type === 'fraction' || col.type === 'pie') ? `${col.n}/${col.d}` : (col.type === 'shape' ? (col.name || 'Shape') : col.val);
                                        let rVal = (r.label.type === 'fraction') ? `${r.label.n}/${r.label.d}` : (r.label.type === 'shape' ? (r.label.name || 'Shape') : r.label.val);
                                        matchAns.push(`${rVal} → ${cVal}`);
                                    }
                                });
                            });
                            answers.push(matchAns.join(', '));
                        } else if (section.type === 'multiple_choice') {
                            let correctOpt = section.options.find(o => o.correct);
                            if (correctOpt) {
                                let temp = document.createElement('div');
                                temp.innerHTML = correctOpt.text;
                                answers.push(temp.textContent || temp.innerText);
                            }
                        } else if (section.type === 'number_line') {
                            answers.push(section.ans);
                        }
                        
                        if (answers.length > 0) {
                            const li = document.createElement('li');
                            li.innerHTML = answers.join('; ');
                            list.appendChild(li);
                        }
                    });
                    
                    dayBlock.appendChild(list);
                    targetCol.appendChild(dayBlock);
                });
            });
        }

        function changeVersion(version) {
            currentVersion = version;
            if (currentModuleIndex !== -1) {
                selectModule(currentModuleIndex);
            }
        }

        function printPacket() {
            document.querySelector('.print-controls').style.display = 'none';

            document.querySelectorAll('input').forEach(input => {
                if (input.type === 'text' || input.type === 'number') {
                    input.value = '';
                } else if (input.type === 'checkbox' || input.type === 'radio') {
                    input.checked = false;
                }
                input.classList.remove('correct-bg', 'incorrect-bg');
            });

            document.querySelectorAll('.correction-text, .grid-answer-indicator').forEach(el => el.remove());
            document.querySelectorAll('.cell-correct, .cell-incorrect, .mc-correct-text, .mc-incorrect-text').forEach(el => {
                el.classList.remove('cell-correct', 'cell-incorrect', 'mc-correct-text', 'mc-incorrect-text');
            });

            document.querySelectorAll('.feedback-box').forEach(el => {
                el.style.display = 'none';
                el.className = 'feedback-box';
            });
            
            document.querySelectorAll('.check-btn').forEach(btn => {
                btn.disabled = false;
                btn.textContent = 'Check Answers';
            });

            for (let day in attempts) {
                attempts[day] = 0;
            }

            window.print();
            
            document.querySelector('.print-controls').style.display = 'flex';
        }

        function selectModule(index) {
            currentModuleIndex = index;
            
            try {
                const url = new URL(window.location);
                url.searchParams.set('module', index);
                window.history.replaceState({}, '', url);
            } catch (e) {
                console.warn("URL state cannot be saved when running via file:// protocol.");
            }

            document.querySelectorAll('.btn-module').forEach((btn, idx) => { if (idx === index) btn.classList.add('active'); else btn.classList.remove('active'); });
            
            const module = appData.modules[index];

            const contentArea = document.getElementById('content-area');

            document.getElementById('footer-controls').style.display = 'none';

                contentArea.innerHTML = `<div class="tbd-message">Coming Soon: ${module.name} (Version ${currentVersion}) content is under development! 🚧</div>`;

                        day.sections.forEach((section, sIdx) => {

                                    t.className = 'mixed-text-container'; 
                                    t.style.marginTop = '10px';
                                    if(prob.textSegments) {
                                        prob.textSegments.forEach(seg => {
                                            if (seg.type === 'text') { const s = document.createElement('span'); s.innerText = seg.val; t.appendChild(s); } 
                                            else if (seg.type === 'fraction') { t.appendChild(createFraction(seg)); }
                                        });
                                    } else { t.innerText = prob.text || ""; }

                                    const inputGroup = document.createElement('div');
                                    inputGroup.className = 'fraction-input-group';
                                    inputGroup.setAttribute('data-answer', prob.ans);
                                    inputGroup.setAttribute('data-type', 'equiv-frac');
                                    const wrap = document.createElement('div'); wrap.className = 'fraction-wrap';
                                    const top = document.createElement('div'); top.className = 'frac-top';
                                    const nInp = document.createElement('input'); nInp.className = 'frac-input'; top.appendChild(nInp);
                                    const bot = document.createElement('div'); bot.className = 'frac-bottom';
                                    const dInp = document.createElement('input'); dInp.className = 'frac-input'; bot.appendChild(dInp);
                                    wrap.appendChild(top); wrap.appendChild(bot); inputGroup.appendChild(wrap);
                                    
                                    t.appendChild(inputGroup);
                                    card.appendChild(t);
                                });
                            }
                            dayDiv.appendChild(card);
                        });

                        currentDaysGrid.appendChild(dayDiv);

                        if (day.name === "Fri" && module.helperHubs) {
                            let hubData = weekData.weekNum === 1 ? module.helperHubs.week1 : module.helperHubs.week2;
                            if (hubData) {
                                const hubDiv = document.createElement('div');
                                hubDiv.className = 'question-card helper-hub hidden'; 
                                hubDiv.style.borderLeft = '8px solid #f1c40f'; 
                                hubDiv.style.backgroundColor = '#fffdf3'; 
                                hubDiv.style.marginTop = '0px'; 
                                hubDiv.innerHTML = `<h3 style="color: #d35400; border-bottom: 2px dashed #f39c12; margin-top:0;">${hubData.title}</h3>${hubData.content}`;
                                currentDaysGrid.appendChild(hubDiv);
                            }
                        }

                    });
                    navContainer.appendChild(row);
                });
                const placeholder = document.createElement('div'); placeholder.id = 'placeholder'; placeholder.style.textAlign = 'center'; placeholder.style.color = '#888'; placeholder.style.marginTop = '50px'; placeholder.style.fontSize = '20px'; placeholder.textContent = "Select a day above to view the problems."; contentArea.appendChild(placeholder);
                
                generateAnswerKey(module, weeksData); 
            }
        }

        function showDay(dayId, btnElement) {
            currentDayId = dayId;
            const ph = document.getElementById('placeholder'); if (ph) ph.style.display = 'none';
            document.querySelectorAll('.day-content, .helper-hub').forEach(d => d.classList.add('hidden'));
            document.getElementById(dayId).classList.remove('hidden');
            
            if (dayId.includes('fri')) {
                const dayContainer = document.getElementById(dayId);
                const nextSibling = dayContainer.nextElementSibling;
                if (nextSibling && nextSibling.classList.contains('helper-hub')) {
                    nextSibling.classList.remove('hidden');
                }
            }

            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); btnElement.classList.add('active');
            document.getElementById('footer-controls').style.display = 'flex';
            document.getElementById('extraPracticeContainer').classList.add('hidden');
            
            const attemptKey = `${dayId}_${currentVersion}`;
            if (!attempts[attemptKey]) attempts[attemptKey] = 0;
            resetUIForDay(dayId, attemptKey);
        }

        function resetUIForDay(dayId, attemptKey) {
            const feedback = document.getElementById('feedback-box');
            const btn = document.querySelector('.check-btn');
            const container = document.getElementById(dayId);
            if (attempts[attemptKey] >= 2) {
                feedback.textContent = "Review your answers above."; feedback.className = "feedback-box info";
                btn.disabled = true; btn.textContent = "Completed";
                revealAnswers(container);
            } else {
                feedback.style.display = 'none'; btn.disabled = false; btn.textContent = "Check Answers";
            }
        }

        function checkAnswers() {
            if (!currentDayId) return;
            const container = document.getElementById(currentDayId);
            const attemptKey = `${currentDayId}_${currentVersion}`;
            let allCorrect = true;

            container.querySelectorAll('input.std-input, input.frac-input').forEach(input => {
                if (input.closest('.mixed-input-group') || input.closest('.fraction-input-group')) return;
                let userVal = input.value.trim(); 
                let correctValStr = input.getAttribute('data-answer');
                let isCorrect = false;
                let correctVals = correctValStr.split('|');
                let cleanUserVal = userVal.replace(/,/g, '');

                for (let i = 0; i < correctVals.length; i++) {
                    let cVal = correctVals[i];
                    let cleanCorrectVal = cVal.replace(/,/g, '');
                    const userNum = parseFloat(cleanUserVal);
                    const correctNum = parseFloat(cleanCorrectVal);

                    if (!isNaN(userNum) && !isNaN(correctNum)) {
                        if (Math.abs(userNum - correctNum) < 0.0001) { isCorrect = true; break; }
                    } else {
                        if (userVal === cVal) { isCorrect = true; break; }
                    }
                }
                if (isCorrect) { input.classList.add('correct-bg'); input.classList.remove('incorrect-bg'); }
                else { input.classList.add('incorrect-bg'); input.classList.remove('correct-bg'); allCorrect = false; }
            });

            container.querySelectorAll('.mixed-input-group, .fraction-input-group').forEach(group => {
                const inputs = group.querySelectorAll('input');
                const type = group.getAttribute('data-type');
                const targetStr = group.getAttribute('data-answer');
                const targetVals = targetStr.split('|').map(v => parseFloat(v));
                let isCorrect = false;

                if (type === 'equiv-frac') {
                    const n = parseFloat(inputs[0].value);
                    const d = parseFloat(inputs[1].value);
                    if (!isNaN(n) && !isNaN(d) && d !== 0) { 
                        if (targetVals.some(t => Math.abs((n / d) - t) < 0.001)) isCorrect = true; 
                    }
                } else if (type === 'mixed-check') {
                    const w = parseFloat(inputs[0].value) || 0;
                    const n = parseFloat(inputs[1].value) || 0;
                    const d = parseFloat(inputs[2].value) || 1;
                    if (targetVals.some(t => Math.abs((w + (n/d)) - t) < 0.001)) isCorrect = true;
                } else {
                    const n = parseFloat(inputs[0].value) || 0;
                    const d = parseFloat(inputs[1].value) || 1;
                    if (targetVals.some(t => Math.abs((n/d) - t) < 0.001)) isCorrect = true;
                }

                if (isCorrect) inputs.forEach(i => { i.classList.add('correct-bg'); i.classList.remove('incorrect-bg'); });
                else { inputs.forEach(i => { i.classList.add('incorrect-bg'); i.classList.remove('correct-bg'); }); allCorrect = false; }
            });

            container.querySelectorAll('tr[data-type="grid-row"]').forEach(row => {
                const checkboxes = row.querySelectorAll('input[type="checkbox"]');
                if(checkboxes.length < 2) return;
                const trueBox = checkboxes[0]; const falseBox = checkboxes[1];
                const correctIsFirst = trueBox.getAttribute('data-correct') === 'true';
                let isRowCorrect = false;
                if (correctIsFirst && trueBox.checked && !falseBox.checked) isRowCorrect = true;
                else if (!correctIsFirst && !trueBox.checked && falseBox.checked) isRowCorrect = true;
                const cells = row.querySelectorAll('td');
                if (isRowCorrect) { cells.forEach(td => { td.classList.add('cell-correct'); td.classList.remove('cell-incorrect'); }); }
                else { cells.forEach(td => { td.classList.add('cell-incorrect'); td.classList.remove('cell-correct'); }); allCorrect = false; }
            });

            container.querySelectorAll('table[data-type="match-grid"]').forEach(table => {
                table.querySelectorAll('tr').forEach((row, idx) => {
                    if (idx === 0) return;
                    const checkboxes = row.querySelectorAll('input[type="checkbox"]');
                    checkboxes.forEach(box => {
                        const isCorrectBox = box.getAttribute('data-correct') === 'true';
                        const parentTd = box.parentNode;
                        if (box.checked) {
                            if (isCorrectBox) { parentTd.classList.add('cell-correct'); parentTd.classList.remove('cell-incorrect'); }
                            else { parentTd.classList.add('cell-incorrect'); parentTd.classList.remove('cell-correct'); allCorrect = false; }
                        } else {
                            if (isCorrectBox) { parentTd.classList.add('cell-incorrect'); parentTd.classList.remove('cell-correct'); allCorrect = false; }
                            else { parentTd.classList.remove('cell-correct'); parentTd.classList.remove('cell-incorrect'); }
                        }
                    });
                });
            });

            container.querySelectorAll('.mc-container').forEach(mc => {
                let isCorrect = false;
                mc.querySelectorAll('.mc-label').forEach(lbl => lbl.classList.remove('mc-correct-text', 'mc-incorrect-text'));
                
                const checked = mc.querySelector('input[type="radio"]:checked');
                if (checked) {
                    if (checked.getAttribute('data-correct') === 'true') {
                        isCorrect = true;
                        checked.parentElement.classList.add('mc-correct-text');
                    } else {
                        checked.parentElement.classList.add('mc-incorrect-text');
                    }
                }
                if (!isCorrect) allCorrect = false;
            });

            const feedback = document.getElementById('feedback-box');
            const btn = document.querySelector('.check-btn');

            if (allCorrect) {
                feedback.textContent = "🎉 PERFECT! Great job!"; feedback.className = "feedback-box correct";
                btn.disabled = true; btn.textContent = "Completed"; attempts[attemptKey] = 2;
            } else {
                attempts[attemptKey]++;
                if (attempts[attemptKey] < 2) { feedback.textContent = "🤔 Not quite. Try again! (Attempt 1 of 2)"; feedback.className = "feedback-box warning"; }
                else { feedback.innerHTML = "❌ Nice try! Here are the correct answers."; feedback.className = "feedback-box info"; revealAnswers(container); btn.disabled = true; btn.textContent = "Completed"; }
            }
        }

        function revealAnswers(container) {
            container.querySelectorAll('input.std-input, input.frac-input').forEach(input => {
                if (input.closest('.mixed-input-group') || input.closest('.fraction-input-group')) return;
                
                const row = input.closest('.math-row');
                if (row && row.innerHTML.includes('Quotient') && row.innerHTML.includes('Remainder')) {
                    const inputs = row.querySelectorAll('input.std-input');
                    if (inputs.length === 2) {
                        if (input === inputs[0]) {
                            const qAns = inputs[0].getAttribute('data-answer');
                            const rAns = inputs[1].getAttribute('data-answer');
                            if (!row.querySelector('.correction-text')) {
                                const span = document.createElement('span');
                                span.className = 'correction-text';
                                span.innerText = `${qAns} R${rAns}`;
                                row.appendChild(span);
                            }
                        }
                        return; 
                    }
                }

                const ans = input.getAttribute('data-answer');
                const displayAns = ans.replace(/\|/g, ' or '); 
                if (!input.nextElementSibling || !input.nextElementSibling.classList.contains('correction-text')) { 
                    const span = document.createElement('span'); 
                    span.className = 'correction-text'; 
                    span.innerText = displayAns; 
                    input.parentNode.insertBefore(span, input.nextSibling); 
                }
            });

            container.querySelectorAll('.mixed-input-group, .fraction-input-group').forEach(group => {
                if (!group.querySelector('.correction-text')) { 
                    const ansStr = group.getAttribute('data-answer');
                    const ans = parseFloat(ansStr.split('|')[0]);
                    const txt = decimalToFractionStr(ans);
                    const span = document.createElement('span'); 
                    span.className = 'correction-text'; 
                    span.innerText = txt; 
                    group.appendChild(span); 
                }
            });
            container.querySelectorAll('tr[data-type="grid-row"]').forEach(row => {
                row.querySelectorAll('input[type="checkbox"]').forEach(box => {
                    if (box.getAttribute('data-correct') === 'true' && !box.parentNode.querySelector('.grid-answer-indicator')) {
                        const div = document.createElement('div'); div.className = 'grid-answer-indicator'; div.innerText = "(Correct)"; box.parentNode.appendChild(div);
                    }
                });
            });
            container.querySelectorAll('table[data-type="match-grid"]').forEach(table => {
                table.querySelectorAll('input[type="checkbox"]').forEach(box => {
                    if (box.getAttribute('data-correct') === 'true' && !box.parentNode.querySelector('.grid-answer-indicator')) {
                        const div = document.createElement('div'); div.className = 'grid-answer-indicator'; div.innerText = "(Correct)"; box.parentNode.appendChild(div); box.checked = true;
                    }
                });
            });
            container.querySelectorAll('.mc-container').forEach(mc => {
                mc.querySelectorAll('input[type="radio"]').forEach(rad => {
                    if (rad.getAttribute('data-correct') === 'true') {
                        rad.parentElement.classList.add('mc-correct-text');
                        rad.checked = true;
                    }
                });
            });
        }

        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            const modParam = urlParams.get('module');
            
            let initialModule = 0;
            if (modParam !== null && !isNaN(modParam)) {
                initialModule = parseInt(modParam, 10);
                if (initialModule < 0 || initialModule >= appData.modules.length) {
                    initialModule = 0;
                }
            }
            selectModule(initialModule);
        };
    </script>
